name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04 # Playwright 1.59 has no browser build for ubuntu-latest (26.04)

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Audit production vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Verify npm registry signatures
        run: npm audit signatures

      - run: npm run test:coverage

      - run: npm run typecheck

      - run: npm run test:rules

      - run: npm run build

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e
